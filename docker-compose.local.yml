services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.container.local}
      POSTGRES_DB: medusa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:8000,http://localhost:18000
      ADMIN_CORS: http://localhost:9000,http://localhost:19000,http://localhost:8000,http://localhost:18000
      AUTH_CORS: http://localhost:9000,http://localhost:19000,http://localhost:8000,http://localhost:18000
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY}
      LOCAL_HTTP_ADMIN: "true"
    ports:
      - "127.0.0.1:19000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        MEDUSA_BACKEND_URL_INTERNAL: http://backend:9000
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:19000
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_DEFAULT_REGION: us
        NEXT_PUBLIC_BASE_URL: http://localhost:18000
    environment:
      NODE_ENV: production
      MEDUSA_BACKEND_URL_INTERNAL: http://backend:9000
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/us').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
